name: Atualizar estudos

# Quando um PDF é enviado para estudos/<livro>/, comprime se estiver grande,
# refaz dados/estudos.json e pede ao GitHub Pages para publicar de novo.
on:
  push:
    branches: [main]
    paths: ["estudos/**"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: atualizar-estudos
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Ghostscript
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ghostscript

      - name: Comprimir PDFs e refazer a lista
        run: python3 scripts/atualizar_estudos.py --comprimir

      - name: Salvar mudanças
        id: salvar
        run: |
          if [ -z "$(git status --porcelain)" ]; then echo "mudou=nao" >> "$GITHUB_OUTPUT"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A estudos dados/estudos.json
          git commit -m "Atualiza a lista de estudos"
          git push
          echo "mudou=sim" >> "$GITHUB_OUTPUT"

      - name: Publicar o site de novo
        if: steps.salvar.outputs.mudou == 'sim'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
